<body data-page="game">
<header class="site-head">
  <div class="wrap">
    <a class="brand" href="index.html" data-i18n="site.name"></a>
    <span class="lang"><a data-lang="ko" href="../ko/">한국어</a> | <a data-lang="en" href="../en/">English</a></span>
    <nav class="nav">
      <a href="index.html" data-i18n="nav.today" aria-current="page"></a>
      <a href="archive.html" data-i18n="nav.archive"></a>
      <a href="how.html" data-i18n="nav.how"></a>
      <a href="about.html" data-i18n="nav.about"></a>
    </nav>
  </div>
</header>
<main class="wrap">
  <div class="notice" id="notice" role="status" data-i18n="game.loading"></div>
  <div class="layout" id="play" hidden>
    <section class="photo-col">
      <div class="viewer" id="viewer">
        <div class="stage" id="stage"><img id="photo" width="1080" height="1350" alt="" draggable="false"><div class="marks" id="marks"></div></div>
        <div class="zoom-ctl">
          <button type="button" data-zoom="in" data-i18n-aria="viewer.zoomIn">＋</button>
          <button type="button" data-zoom="out" data-i18n-aria="viewer.zoomOut">－</button>
          <button type="button" data-zoom="reset" data-i18n-aria="viewer.reset">↺</button>
          <button type="button" data-zoom="full" data-i18n-aria="viewer.full">⤢</button>
        </div>
      </div>
      <p class="hint small" id="hint" data-i18n="viewer.hint"></p>
      <div class="bubble" id="bubble" role="status" hidden></div>
    </section>
    <section class="q-col">
      <p class="case-no" id="caseNo"></p>
      <h1 id="caseTitle"></h1>
      <p class="intro" id="caseIntro"></p>
      <div id="questions"></div>
      <button type="button" class="submit" id="submitBtn" data-i18n="submit"></button>
      <p id="submitMsg" role="status"></p>
      <p class="small" id="submitNote" data-i18n="submit.note"></p>
      <section id="result" hidden></section>
    </section>
  </div>
</main>
<footer class="site-foot">
  <div class="wrap"><span data-i18n="footer.text"></span> · <a href="privacy.html" data-i18n="nav.privacy"></a></div>
</footer>

<script src="../js/i18n.js"></script>
<script src="../js/app.js"></script>
</body>
</html>
